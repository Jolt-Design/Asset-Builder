name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: npm install -g corepack

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: corepack yarn install --immutable
      - run: corepack yarn run biome ci
      - run: corepack yarn run test

      - name: Publish to npm
        run: npm publish --access public
