name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["20", "22", "24", "26", "latest"]

    env:
      # Overrides the Node version from .mise.toml
      MISE_NODE_VERSION: ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: jdx/mise-action@v5
        with:
          # The default cache key doesn't include MISE_NODE_VERSION
          cache_key_prefix: mise-node-${{ matrix.node-version }}

      # The version override may drop the postinstall hook from .mise.toml
      - name: Enable Corepack
        run: npm install -g corepack

      - name: Get Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: corepack yarn install --immutable
      - run: corepack yarn run biome ci
      - run: corepack yarn run test
